name: Generate PlaneSlate airport map
run-name: Airport map ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      snapshot_key:
        required: true
        type: string
      snapshot_sha256:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: planeslate-airport-maps
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository == 'PlaneSlate/liveries' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r publisher/requirements.txt
      - name: Retrieve or render airport geometry
        env:
          JOB_ID: ${{ inputs.job_id }}
          SNAPSHOT_KEY: ${{ inputs.snapshot_key }}
          SNAPSHOT_SHA256: ${{ inputs.snapshot_sha256 }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python publisher/airport-map-job.py
